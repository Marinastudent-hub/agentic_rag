
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic RAG Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="app-container">

        <aside class="sidebar">
            <div class="brand">
                <h2>Agentic RAG</h2>
                <p>Intelligent Knowledge Assistant</p>
            </div>

            <button id="new-chat-btn" class="new-chat-btn">+ New Chat</button>

                  <div class="sidebar-section">
      <h3>Chat History</h3>
    <div id="chat-history">
        <p>Loading conversations...</p>
    </div>
</div>

            <div class="sidebar-section">
                <h3>Knowledge Base</h3>

                <label for="file-upload" class="upload-btn">
                    + Upload Document
                </label>
                <input type="file" id="file-upload"
                       accept=".pdf,.docx,.txt,.md" hidden>

                <div id="upload-status"></div>
                <div id="documents-list"></div>
            </div>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <h2>AI Assistant</h2>
                <span class="status">● Online</span>
            </header>

            <section id="chat-messages" class="chat-messages">
                <div class="welcome-message">
                    <h1>Welcome to Agentic RAG</h1>
                    <p>Ask questions about your uploaded documents.</p>
                </div>
            </section>

            <form id="chat-form" class="chat-input-area">
                <textarea id="message-input"
                          placeholder="Ask anything about your documents..."
                          rows="1" required></textarea>

                <button type="submit" id="send-btn">
                    Send
                </button>
            </form>
        </main>

    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
